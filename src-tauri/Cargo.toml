[package]
name = "enkel"
version = "1.0.0"
description = "Enkel — Minimalist local-first Markdown notes"
authors = ["Enkel Contributors"]
license = "MIT"
repository = "https://github.com/machntoshh/enkel"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "enkel_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rfd = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
