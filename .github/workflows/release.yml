name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows Release Artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: |
          npm test
          cd src-tauri && cargo test --locked

      - name: Build Tauri application & installers
        run: npx tauri build

      - name: Prepare release artifacts and SHA-256 checksums
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $ver = "$env:TAG_NAME".TrimStart('v')
          Copy-Item "src-tauri/target/release/enkel.exe" "dist-release/Enkel-${ver}-windows-x64-portable.exe"
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist-release/"
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist-release/"
          $hashes = Get-ChildItem "dist-release/*" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $hashes | Set-Content -Path "dist-release/SHA256SUMS.txt" -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-release/*
